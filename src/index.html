<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MP1 | Jovani Trejo</title>
    </head>
    <body>
        <div id="navbar">
            <a id="nav-title" href="#home">Jovani Trejo</a>
            <div id="navigation-section" class="links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
        <div class="content">
            <section id="home" class="section">
                <img 
                    src="assets/overview_shot_main_quad.jpg" 
                    alt="A top-down arial view of main quad at University of Illinois Urbana-Champaign"
                    id="main-quad"
                />
            </section>
            <section id="about" class="section">
                <h2>Education</h2>
                <div class="education">
                    <div class="modal" id="gbn" img-src="assets/glenbard-north-high-school-carol-stream-il-2-schoolphoto.webp">
                        <img src="https://www.glenbardnorthhs.org/wp-content/uploads/sites/3/2018/01/color-logo-120.png" alt="GBN Logo" />
                        <h5>Glenbard North High School</h5>
                        <p>2019-2023</p>
                    </div>
                    <div class="modal" id="uic" img-src="assets/COE-buildings.jpg.avif">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/22/University_of_Illinois_Logo.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
                            alt="UIC Logo" />
                        <h5>University of Illinois Chicago</h5>
                        <p>2023-2025</p>
                    </div>
                    <div class="modal" id="uiuc" img-src="assets/UIUCEngineeringHall.jpg">
                        <img src="https://cdn.worldvectorlogo.com/logos/university-of-illinois-1.svg" alt="Block I Logo" />
                        <h5>University of Illinois Urbana-Champaign</h5>
                        <p>2019-2023</p>
                    </div>
                </div>
            </section>
            <section id="contact" class="section"></section>
        </div>
        <div id="footer">
            <p>Jovani Trejo &copy; 2026</p>
        </div>
        <div id="video-modal-overlay" class="video-modal-overlay hidden">
            <div class="video-modal">
                <button id="video-modal-close" aria-label="Close">&times;</button>
                <div class="video-modal-embed">
                    <img id="video-modal-image"/>
                </div>
            </div>
        </div>
        <script src="js/main.js"></script>
    </body>
</html>
